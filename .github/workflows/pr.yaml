name: Tests

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y --no-install-recommends python3-setuptools
          pip3 install --upgrade setuptools
          pip3 install wheel twine

      - name: Build package
        run: python3 setup.py sdist bdist_wheel

      - name: Twine check
        run: python3 -m twine check dist/*

  lint-python:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          python3 -m pip install --upgrade pip
          sudo pip3 install flake8 black

      - name: Lint Python
        run: python3 -m flake8 canonicalwebteam setup.py && python3 -m black --line-length 79 --check canonicalwebteam setup.py

  test-python:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update && sudo apt install -y --no-install-recommends python3-setuptools
          pip3 install flask-reggie vcrpy vcrpy-unittest
          sudo python3 setup.py install

      - name: Test Python
        run: python3 -m unittest discover tests

  check-inclusive-naming:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inclusive naming
        uses: canonical-web-and-design/inclusive-naming@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail-on-error: true

  check-version-bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and changelog are updated
        run: |
          set -euo pipefail

          VERSION_PATTERN='(?<=version=")[^"]+'

          git fetch origin "${{ github.base_ref }}"
          BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if ! echo "$CHANGED_FILES" | grep -q '^canonicalwebteam/'; then
            echo "No changes under canonicalwebteam/, skipping version/changelog check."
            exit 0
          fi

          MISSING=""
          echo "$CHANGED_FILES" | grep -qx 'setup.py' || MISSING="$MISSING setup.py"
          echo "$CHANGED_FILES" | grep -qx 'CHANGELOG.txt' || MISSING="$MISSING CHANGELOG.txt"

          if [ -n "$MISSING" ]; then
            echo "::error::canonicalwebteam/ was changed but the following files were not updated:$MISSING. Please bump the version in setup.py and add a CHANGELOG.txt entry."
            exit 1
          fi

          OLD_VERSION=$(git show "$BASE_SHA:setup.py" | grep -oP "$VERSION_PATTERN" || true)
          NEW_VERSION=$(grep -oP "$VERSION_PATTERN" setup.py || true)

          if [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "::error::setup.py was modified but the version string was not changed ($OLD_VERSION). Please bump the version."
            exit 1
          fi

          echo "Version bumped from $OLD_VERSION to $NEW_VERSION."
